<div class="container-fluid fade-in">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1 text-slate-800">Gestión de Proyectos</h2>
      <p class="text-muted mb-0">Administra los proyectos que agrupan las minutas y acuerdos.</p>
    </div>
    <button class="btn btn-primary rounded-pill px-3" onclick="openModalProyecto()">
      <i class="bi bi-plus-lg me-1"></i> Nuevo Proyecto
    </button>
  </div>

  <div class="card card-custom p-3">
    <div class="table-responsive">
      <table class="table table-hover align-middle w-100" id="tableProyectos">
        <thead class="table-light">
          <tr>
            <th>Nombre del Proyecto</th>
            <th>Descripción</th>
            <th>Fecha de Creación</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Se llena dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Crear/Editar Proyecto -->
<div class="modal fade" id="modalProyecto" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="formProyecto" onsubmit="handleGuardarProyecto(event)">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="modalProyectoTitle">Nuevo Proyecto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="proyecto_id" name="id_proyecto">

          <div class="mb-3">
            <label for="proyecto_nombre" class="form-label fw-semibold">Nombre del Proyecto <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="proyecto_nombre" required placeholder="Ej. Implementación ERP">
          </div>

          <div class="mb-3">
            <label for="proyecto_descripcion" class="form-label fw-semibold">Descripción</label>
            <textarea class="form-control" id="proyecto_descripcion" rows="3" placeholder="Breve descripción del objetivo del proyecto"></textarea>
          </div>

          <div class="mb-3">
            <label for="proyecto_estado" class="form-label fw-semibold">Estado</label>
            <select class="form-select" id="proyecto_estado">
              <option value="Activo">Activo</option>
              <option value="Finalizado">Finalizado</option>
              <option value="Pausado">Pausado</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary px-4">Guardar</button>
        </div>
      </form>
    </div>
  </div>
</div>
