  function showLoading(show) {
    if (show === undefined) show = true;
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.style.display = show ? 'flex' : 'none';

    if (loadingTimeout) {
      clearTimeout(loadingTimeout);
      loadingTimeout = null;
    }

    if (show) {
      loadingTimeout = setTimeout(function() {
        const ov = document.getElementById('loadingOverlay');
        if (ov && ov.style.display !== 'none') {
          ov.style.display = 'none';
          showToast('La operación tardó más de lo esperado. Se ha desbloqueado la pantalla.', false);
        }
      }, 15000);
    }
  }

  function showToast(message, isSuccess) {
    if (isSuccess === undefined) isSuccess = true;
    const toastContainer = document.getElementById('toastContainer');
    if (!toastContainer) return;

    const toastId = 'toast_' + Date.now();
    const bgClass = isSuccess ? 'bg-success text-white' : 'bg-danger text-white';
    const icon = isSuccess ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill';

    const html = '<div id="' + toastId + '" class="toast align-items-center ' + bgClass + ' border-0 mb-2 shadow" role="alert" aria-live="assertive" aria-atomic="true">' +
      '<div class="d-flex">' +
        '<div class="toast-body d-flex align-items-center gap-2">' +
          '<i class="bi ' + icon + ' fs-5"></i>' +
          '<div>' + escapeHtml(message) + '</div>' +
        '</div>' +
        '<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>' +
      '</div>' +
    '</div>';

    toastContainer.insertAdjacentHTML('beforeend', html);
    const toastEl = document.getElementById(toastId);
    if (toastEl && typeof bootstrap !== 'undefined' && bootstrap.Toast) {
      const bsToast = new bootstrap.Toast(toastEl, { delay: 4000 });
      bsToast.show();
      toastEl.addEventListener('hidden.bs.toast', function() { toastEl.remove(); });
    }
  }

  function refreshAppData() {
    showLoading(true);
    try {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        showLoading(false);
        renderDashboard();
        renderProyectosTable();
        renderMinutasTable();
        renderSeguimientoTable();
        populateSelects();
        return;
      }

      google.script.run
        .withSuccessHandler(function(responseRaw) {
          showLoading(false);
          try {
            const response = typeof responseRaw === 'string' ? JSON.parse(responseRaw) : responseRaw;
            if (response && response.success) {
              APP_DATA = response.data || { proyectos: [], minutas: [], acuerdos: [] };
              renderDashboard();
              renderProyectosTable();
              renderMinutasTable();
              renderSeguimientoTable();
              populateSelects();
            } else {
              showToast((response && response.message) || 'Error al actualizar datos.', false);
            }
          } catch (err) {
            showToast('Error al desplegar los datos: ' + err.message, false);
          }
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          showToast('Error de conexión con el servidor: ' + (err ? err.message : 'Desconocido'), false);
        })
        .getInitialData();
    } catch (e) {
      showLoading(false);
      showToast('Error al iniciar la carga: ' + e.message, false);
    }
  }

  function navigateTo(viewName) {
    document.querySelectorAll('.view-section').forEach(function(el) {
      if (el && el.classList) el.classList.add('d-none');
    });
    const target = document.getElementById('view-' + viewName);
    if (target && target.classList) target.classList.remove('d-none');

    document.querySelectorAll('#sidebar ul li a').forEach(function(a) {
      if (a && a.classList) a.classList.remove('active');
    });
    const activeLink = document.querySelector('#sidebar ul li a[onclick*="' + viewName + '"]');
    if (activeLink && activeLink.classList) activeLink.classList.add('active');

    if (window.innerWidth <= 768) {
      const sb = document.getElementById('sidebar');
      if (sb && sb.classList) sb.classList.remove('active');
    }
  }

  function toggleSidebar() {

  function getInitials(str) {
    if (!str) return 'NA';
    const stopWords = ['DE', 'DEL', 'Y', 'E', 'LA', 'LAS', 'EL', 'LOS', 'EN', 'POR', 'PARA', 'CON'];
    const cleaned = String(str).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase();
    const words = cleaned.split(/[\s\-_/]+/).filter(function(w) { return w.length > 0 && !stopWords.includes(w); });
    if (words.length === 0) {
      const allWords = cleaned.split(/[\s\-_/]+/).filter(function(w) { return w.length > 0; });
      if (allWords.length === 0) return 'NA';
      return allWords.map(function(w) { return w[0]; }).join('');
    }
    return words.map(function(w) { return w[0]; }).join('');
  }

  function generarFolioMinutaUI() {
    const projId = document.getElementById('minuta_proyecto') ? document.getElementById('minuta_proyecto').value : '';
    const etapaVal = document.getElementById('minuta_etapa') ? document.getElementById('minuta_etapa').value : '';
    const depVal = document.getElementById('minuta_dependencia') ? document.getElementById('minuta_dependencia').value : '';
    const subVal = document.getElementById('minuta_subdireccion') ? document.getElementById('minuta_subdireccion').value : '';
    const fechaVal = document.getElementById('minuta_fecha') ? document.getElementById('minuta_fecha').value : '';

    let projNombre = '';
    if (projId && APP_DATA.proyectos) {
      const p = APP_DATA.proyectos.find(function(item) { return item.id_proyecto === projId; });
      if (p) projNombre = p.nombre;
    }

    const initProj = getInitials(projNombre);
    const initEtapa = getInitials(etapaVal);
    const initDep = getInitials(depVal);
    const initSub = getInitials(subVal);

    let fechaFormateada = 'YYYYMMDD';
    if (fechaVal) {
      fechaFormateada = fechaVal.replace(/-/g, '');
    }

    const folioStr = initProj + '-' + initEtapa + '-' + initDep + '-' + initSub + '-' + fechaFormateada;
    const inputFolio = document.getElementById('minuta_folio');
    if (inputFolio) {
      inputFolio.value = folioStr;
    }
  }

  function openSeguimientoAcuerdosMinuta(idMinuta) {

    showLoading(true);

      .withSuccessHandler(function(resRaw) {
        showLoading(false);
        const res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
        if (res.success && res.data) {
          const minuta = res.data.minuta || {};
          const acuerdos = res.data.acuerdos || [];

          const tbody = document.getElementById('tbodySeguimientoMinutaAcuerdos');
          tbody.innerHTML = '';

          if (acuerdos.length === 0) {
            tbody.innerHTML = '<tr><td colspan="11" class="text-center text-muted py-3">Esta minuta no contiene acciones ni acuerdos registrados.</td></tr>';
          } else {
            acuerdos.forEach(function(ac, idx) {
              const est = ac.estado_calculado || 'Pendiente';
              const optPendiente = est === 'Pendiente' ? 'selected' : '';
              const optPorVencer = est === 'Por vencer' ? 'selected' : '';
              const optVencido = est === 'Vencido' ? 'selected' : '';
              const optAtendido = est === 'Atendido' ? 'selected' : '';
              const optCancelado = est === 'Cancelado' ? 'selected' : '';

        showLoading(false);
        showToast(err.message, false);
      })

  function syncSeguimientoTrackingOptions(currentMinutaId) {
    const selects = document.querySelectorAll('#tbodySeguimientoMinutaAcuerdos .seg-acuerdo-tracking');
    if (selects.length === 0) return;

    const minutas = APP_DATA.minutas || [];

    selects.forEach(function(select) {
      const rawVal = select.getAttribute('data-selected') ? select.getAttribute('data-selected').trim() : '';

      select.innerHTML = '<option value="">-- Sin Minuta Anterior --</option>';

      let isSelected = false;

      minutas.forEach(function(m) {
        if (currentMinutaId && m.id_minuta === currentMinutaId) return;
        const folioVal = (m.folio && m.folio !== 'N/A') ? m.folio : (m.titulo || m.id_minuta);
        const labelText = (m.folio && m.folio !== 'N/A') ? (m.folio + ' - ' + m.titulo) : m.titulo;
        const opt = document.createElement('option');
        opt.value = folioVal;
        opt.textContent = labelText;

        if (rawVal && (rawVal === folioVal || rawVal.split(',').map(function(s){return s.trim();}).includes(folioVal))) {
          opt.selected = true;
          isSelected = true;
        }
        select.appendChild(opt);
      });

      if (rawVal && !isSelected) {
        const opt = document.createElement('option');
        opt.value = rawVal;
        opt.textContent = rawVal;
        opt.selected = true;
        select.appendChild(opt);
      }
    });
  }

  function handleGuardarSeguimientoMinuta(e) {
    e.preventDefault();

    const cambios = [];
    document.querySelectorAll('#tbodySeguimientoMinutaAcuerdos tr[data-id-acuerdo]').forEach(function(tr) {
      const idAcuerdo = tr.getAttribute('data-id-acuerdo');
      const selectEst = tr.querySelector('.seg-acuerdo-estado');
      const selectTrack = tr.querySelector('.seg-acuerdo-tracking');
      const inputNumAnt = tr.querySelector('.seg-acuerdo-num-ant');
      const inputNotas = tr.querySelector('.seg-acuerdo-notas');

      const trackVal = selectTrack ? selectTrack.value : '';

      if (idAcuerdo && selectEst) {
        cambios.push({
          id_acuerdo: idAcuerdo,
          estado: selectEst.value,
          tracking: trackVal,
          num_acuerdo_anterior: inputNumAnt ? inputNumAnt.value.trim() : '',
          notas: inputNotas ? inputNotas.value : ''
        });
      }
    });

    showLoading(true);
    google.script.run
      .withSuccessHandler(function(resRaw) {
        showLoading(false);
        const res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
        if (res.success) {
          showToast(res.message);
          bootstrap.Modal.getInstance(document.getElementById('modalSeguimientoMinuta')).hide();
          refreshAppData();
        } else {
          showToast(res.message, false);
        }
      })
      .withFailureHandler(function(err) {
        showLoading(false);
        showToast(err.message, false);
      })
      .guardarSeguimientoAcuerdosMinuta(cambios);

  function openModalMinuta(idMinuta) {
    if (idMinuta === undefined) idMinuta = null;
    document.getElementById('formMinuta').reset();
    document.getElementById('minuta_id').value = '';
    document.getElementById('tbodyAsistencia').innerHTML = '';
    document.getElementById('tbodyOrden').innerHTML = '';
    document.getElementById('tbodyAcuerdos').innerHTML = '';

    populateSelectProyectos();
    populateSelectMinutaFormOptions();

    if (idMinuta) {
      document.getElementById('modalMinutaTitle').innerText = 'Editar Minuta de Reunión';
      showLoading(true);
      google.script.run
        .withSuccessHandler(function(resRaw) {
          showLoading(false);
          const res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
          if (res.success && res.data) {
            const minuta = res.data.minuta;
            const asistencia = res.data.asistencia;
            const ordenDelDia = res.data.ordenDelDia;
            const acuerdos = res.data.acuerdos;

            document.getElementById('minuta_id').value = minuta.id_minuta;
            document.getElementById('minuta_proyecto').value = minuta.id_proyecto || '';
            document.getElementById('minuta_etapa').value = minuta.etapa || '';
            document.getElementById('minuta_dependencia').value = minuta.dependencia || '';
            document.getElementById('minuta_subdireccion').value = minuta.subdireccion || '';
            document.getElementById('minuta_titulo').value = minuta.titulo || '';
            document.getElementById('minuta_folio').value = minuta.folio || '';
            document.getElementById('minuta_fecha').value = formatDateISOJS(minuta.fecha_reunion);
            document.getElementById('minuta_lugar').value = minuta.lugar || '';
            document.getElementById('minuta_objetivo').value = minuta.objetivo || '';

            if (asistencia && asistencia.length > 0) {
              asistencia.forEach(function(a) { addAsistenciaRow(a.nombre, a.dependencia, a.ap, a.at, a.na); });
            } else {
              addAsistenciaRow();
            }

            if (ordenDelDia && ordenDelDia.length > 0) {
              ordenDelDia.forEach(function(o) { addOrdenRow(o.descripcion); });
            } else {
              addOrdenRow();
            }

            if (acuerdos && acuerdos.length > 0) {
              acuerdos.forEach(function(ac) {
                addAcuerdoRow(
                  ac.tipo || 'Acuerdo',
                  ac.descripcion,
                  ac.prioridad || 'Media',
                  ac.solicitante || '',
                  ac.responsable || '',
                  formatDateISOJS(ac.fecha_cumplimiento)
                );
              });
            } else {
              addAcuerdoRow();
            }

            syncParticipantesOptions();
            if (!minuta.folio || minuta.folio === 'N/A') {
              generarFolioMinutaUI();
            }
          }
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          showToast(err.message, false);
        })
        .obtenerDetalleMinuta(idMinuta);
    } else {
      document.getElementById('modalMinutaTitle').innerText = 'Nueva Minuta de Reunión';
      document.getElementById('minuta_fecha').value = new Date().toISOString().split('T')[0];
      addAsistenciaRow();
      addOrdenRow();
      addAcuerdoRow();
      generarFolioMinutaUI();
    }

    const modal = new bootstrap.Modal(document.getElementById('modalMinuta'));
    modal.show();
  }

  function addAsistenciaRow(nombre, dependencia, ap, at, na) {
    if (nombre === undefined) nombre = '';
    if (dependencia === undefined) dependencia = '';
    if (ap === undefined) ap = true;
    if (at === undefined) at = false;
    if (na === undefined) na = false;

    const tbody = document.getElementById('tbodyAsistencia');
    if (!tbody) return;
    const rowIdx = tbody.children.length + 1;

    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="text-center row-num">' + rowIdx + '</td>' +
      '<td><input type="text" class="form-control form-control-sm asistencia-nombre" value="' + escapeHtml(nombre) + '" placeholder="Nombre completo" required oninput="syncParticipantesOptions()"></td>' +
      '<td><input type="text" class="form-control form-control-sm asistencia-dep" value="' + escapeHtml(dependencia) + '" placeholder="Área / Entidad"></td>' +
      '<td class="text-center"><input type="checkbox" class="form-check-input asistencia-ap" ' + (ap ? 'checked' : '') + ' onchange="handleCheckboxAsistencia(this, \'ap\')"></td>' +
      '<td class="text-center"><input type="checkbox" class="form-check-input asistencia-at" ' + (at ? 'checked' : '') + ' onchange="handleCheckboxAsistencia(this, \'at\')"></td>' +
      '<td class="text-center"><input type="checkbox" class="form-check-input asistencia-na" ' + (na ? 'checked' : '') + ' onchange="handleCheckboxAsistencia(this, \'na\')"></td>' +
      '<td class="text-center"><button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="removeRow(this); syncParticipantesOptions();"><i class="bi bi-trash"></i></button></td>';

    tbody.appendChild(tr);
    renumberTable('tbodyAsistencia');
  }

  function handleCheckboxAsistencia(checkbox, type) {
    const tr = checkbox.closest('tr');
    if (checkbox.checked && tr) {
      if (type === 'ap') {
        tr.querySelector('.asistencia-at').checked = false;
        tr.querySelector('.asistencia-na').checked = false;
      } else if (type === 'at') {
        tr.querySelector('.asistencia-ap').checked = false;
        tr.querySelector('.asistencia-na').checked = false;
      } else if (type === 'na') {
        tr.querySelector('.asistencia-ap').checked = false;
        tr.querySelector('.asistencia-at').checked = false;
      }
    }
  }

  function addOrdenRow(descripcion) {
    if (descripcion === undefined) descripcion = '';
    const tbody = document.getElementById('tbodyOrden');
    if (!tbody) return;
    const rowIdx = tbody.children.length + 1;

    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="text-center row-num">' + rowIdx + '</td>' +
      '<td><input type="text" class="form-control form-control-sm orden-desc" value="' + escapeHtml(descripcion) + '" placeholder="Punto de agenda" required></td>' +
      '<td class="text-center"><button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="removeRow(this);"><i class="bi bi-trash"></i></button></td>';

    tbody.appendChild(tr);
    renumberTable('tbodyOrden');
  }

  function addAcuerdoRow(tipo, descripcion, prioridad, solicitante, responsable, fecha) {
    if (tipo === undefined) tipo = 'Acuerdo';
    if (descripcion === undefined) descripcion = '';
    if (prioridad === undefined) prioridad = 'Media';
    if (solicitante === undefined) solicitante = '';
    if (responsable === undefined) responsable = '';
    if (fecha === undefined) fecha = '';

    const tbody = document.getElementById('tbodyAcuerdos');
    if (!tbody) return;
    const rowIdx = tbody.children.length + 1;

    const optInfo = tipo === 'Informativo' ? 'selected' : '';
    const optAcuerdo = tipo === 'Acuerdo' ? 'selected' : '';
    const optAjuste = tipo === 'Ajuste Técnico' ? 'selected' : '';

    const optAlta = prioridad === 'Alta' ? 'selected' : '';
    const optMedia = prioridad === 'Media' ? 'selected' : '';
    const optBaja = prioridad === 'Baja' ? 'selected' : '';

    const tr = document.createElement('tr');
    tr.innerHTML = '<td class="text-center row-num">' + rowIdx + '</td>' +
      '<td>' +
        '<select class="form-select form-select-sm acuerdo-tipo" required onchange="handleTipoChange(this)">' +
          '<option value="Acuerdo" ' + optAcuerdo + '>Acuerdo</option>' +
          '<option value="Informativo" ' + optInfo + '>Informativo</option>' +
          '<option value="Ajuste Técnico" ' + optAjuste + '>Ajuste Técnico</option>' +
        '</select>' +
      '</td>' +
      '<td><textarea class="form-control form-control-sm acuerdo-desc" rows="2" placeholder="Descripción" required>' + escapeHtml(descripcion) + '</textarea></td>' +
      '<td>' +
        '<select class="form-select form-select-sm acuerdo-prioridad" required>' +
          '<option value="Alta" ' + optAlta + '>Alta</option>' +
          '<option value="Media" ' + optMedia + '>Media</option>' +
          '<option value="Baja" ' + optBaja + '>Baja</option>' +
        '</select>' +
      '</td>' +
      '<td>' +
        '<select class="form-select form-select-sm acuerdo-solicitante" multiple data-selected="' + escapeHtml(solicitante) + '" style="height: 65px;">' +
        '</select>' +
      '</td>' +
      '<td>' +
        '<select class="form-select form-select-sm acuerdo-resp" multiple required data-selected="' + escapeHtml(responsable) + '" style="height: 65px;">' +
        '</select>' +
      '</td>' +
      '<td><input type="date" class="form-control form-control-sm acuerdo-fecha" value="' + escapeHtml(fecha) + '" required></td>' +
      '<td class="text-center"><button type="button" class="btn btn-sm btn-link text-danger p-0" onclick="removeRow(this);"><i class="bi bi-trash"></i></button></td>';

    tbody.appendChild(tr);
    renumberTable('tbodyAcuerdos');
    syncParticipantesOptions();

    const selectTipo = tr.querySelector('.acuerdo-tipo');
    if (selectTipo) handleTipoChange(selectTipo);
  }

  function handleTipoChange(selectTipo) {
    const tr = selectTipo.closest('tr');
    if (!tr) return;
    const inputFecha = tr.querySelector('.acuerdo-fecha');
    if (!inputFecha) return;

    if (selectTipo.value === 'Informativo') {
      inputFecha.required = false;
      inputFecha.disabled = true;
      inputFecha.value = '';
      inputFecha.classList.add('bg-light');
    } else {
      inputFecha.required = true;
      inputFecha.disabled = false;
      inputFecha.classList.remove('bg-light');
    }
  }

  function removeRow(btn) {
    const tr = btn.closest('tr');
    if (!tr) return;
    const tbody = tr.parentElement;
    tr.remove();
    if (tbody && tbody.id) renumberTable(tbody.id);
  }

  function renumberTable(tbodyId) {
    const tbody = document.getElementById(tbodyId);
    if (!tbody) return;
    Array.from(tbody.children).forEach(function(tr, index) {
      const numTd = tr.querySelector('.row-num');
      if (numTd) numTd.innerText = index + 1;
    });
  }

  function syncParticipantesOptions() {
    const nombres = Array.from(document.querySelectorAll('#tbodyAsistencia .asistencia-nombre'))
      .map(function(input) { return input.value.trim(); })
      .filter(function(val) { return val !== ''; });

    ['.acuerdo-solicitante', '.acuerdo-resp'].forEach(function(selector) {
      const selects = document.querySelectorAll('#tbodyAcuerdos ' + selector);
      selects.forEach(function(select) {
        const rawVal = select.getAttribute('data-selected') || '';
        let selectedValues = [];
        if (select.selectedOptions && select.selectedOptions.length > 0) {
          selectedValues = Array.from(select.selectedOptions).map(function(o) { return o.value; });
        } else if (rawVal) {
          selectedValues = rawVal.split(',').map(function(s) { return s.trim(); });
        }

        select.innerHTML = '';

        const optTodos = document.createElement('option');
        optTodos.value = 'Todos';
        optTodos.textContent = 'Todos';
        if (selectedValues.includes('Todos')) optTodos.selected = true;
        select.appendChild(optTodos);

        nombres.forEach(function(nombre) {
          const opt = document.createElement('option');
          opt.value = nombre;
          opt.textContent = nombre;
          if (selectedValues.includes(nombre)) opt.selected = true;
          select.appendChild(opt);
        });

        selectedValues.forEach(function(val) {
          if (val && val !== 'Todos' && !nombres.includes(val)) {
            const opt = document.createElement('option');
            opt.value = val;
            opt.textContent = val;
            opt.selected = true;
            select.appendChild(opt);
          }
        });
      });
    });
  }

  function syncResponsablesOptions() {
    syncParticipantesOptions();
  }

  function syncTrackingOptions() {
    const selects = document.querySelectorAll('#tbodyAcuerdos .acuerdo-tracking');
    if (selects.length === 0) return;

    const minutas = APP_DATA.minutas || [];
    const currentMinutaId = document.getElementById('minuta_id') ? document.getElementById('minuta_id').value : '';

    selects.forEach(function(select) {
      const rawVal = select.getAttribute('data-selected') || '';
      let selectedValues = [];
      if (select.selectedOptions && select.selectedOptions.length > 0) {
        selectedValues = Array.from(select.selectedOptions).map(function(o) { return o.value; });
      } else if (rawVal) {
        selectedValues = rawVal.split(',').map(function(s) { return s.trim(); });
      }

      select.innerHTML = '';

      minutas.forEach(function(m) {
        if (currentMinutaId && m.id_minuta === currentMinutaId) return;
        const folioVal = (m.folio && m.folio !== 'N/A') ? m.folio : (m.titulo || m.id_minuta);
        const labelText = (m.folio && m.folio !== 'N/A') ? (m.folio + ' - ' + m.titulo) : m.titulo;
        const opt = document.createElement('option');
        opt.value = folioVal;
        opt.textContent = labelText;
        if (selectedValues.includes(folioVal)) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });

      selectedValues.forEach(function(val) {
        if (val && !minutas.some(function(m) { return (m.folio === val || m.titulo === val || m.id_minuta === val); })) {
          const opt = document.createElement('option');
          opt.value = val;
          opt.textContent = val;
          opt.selected = true;
          select.appendChild(opt);
        }
      });
    });
  }

  function handleGuardarMinuta(e) {
    e.preventDefault();

    const minuta = {
      id_minuta: document.getElementById('minuta_id').value,
      id_proyecto: document.getElementById('minuta_proyecto').value,
      etapa: document.getElementById('minuta_etapa') ? document.getElementById('minuta_etapa').value : '',
      dependencia: document.getElementById('minuta_dependencia') ? document.getElementById('minuta_dependencia').value : '',
      subdireccion: document.getElementById('minuta_subdireccion') ? document.getElementById('minuta_subdireccion').value : '',
      folio: document.getElementById('minuta_folio') ? document.getElementById('minuta_folio').value : '',
      titulo: document.getElementById('minuta_titulo').value,
      fecha_reunion: document.getElementById('minuta_fecha').value,
      lugar: document.getElementById('minuta_lugar').value,
      objetivo: document.getElementById('minuta_objetivo').value
    };

    const asistencia = [];
    document.querySelectorAll('#tbodyAsistencia tr').forEach(function(tr) {
      asistencia.push({
        nombre: tr.querySelector('.asistencia-nombre').value,
        dependencia: tr.querySelector('.asistencia-dep').value,
        ap: tr.querySelector('.asistencia-ap').checked,
        at: tr.querySelector('.asistencia-at').checked,
        na: tr.querySelector('.asistencia-na').checked
      });
    });

    const ordenDelDia = [];
    document.querySelectorAll('#tbodyOrden tr').forEach(function(tr) {
      ordenDelDia.push({
        descripcion: tr.querySelector('.orden-desc').value
      });
    });

    const acuerdos = [];
    document.querySelectorAll('#tbodyAcuerdos tr').forEach(function(tr) {
      const selectSol = tr.querySelector('.acuerdo-solicitante');
      let solArr = [];
      if (selectSol && selectSol.selectedOptions) {
        solArr = Array.from(selectSol.selectedOptions).map(function(o) { return o.value; });
      }

      const selectResp = tr.querySelector('.acuerdo-resp');
      let respArr = [];
      if (selectResp && selectResp.selectedOptions) {
        respArr = Array.from(selectResp.selectedOptions).map(function(o) { return o.value; });
      }

      acuerdos.push({
        tipo: tr.querySelector('.acuerdo-tipo') ? tr.querySelector('.acuerdo-tipo').value : 'Acuerdo',
        descripcion: tr.querySelector('.acuerdo-desc').value,
        prioridad: tr.querySelector('.acuerdo-prioridad') ? tr.querySelector('.acuerdo-prioridad').value : 'Media',
        solicitante: solArr.join(', '),
        responsable: respArr.join(', '),
        fecha_cumplimiento: tr.querySelector('.acuerdo-fecha').value,
        estado: 'Pendiente'
      });
    });

    const payload = { minuta: minuta, asistencia: asistencia, ordenDelDia: ordenDelDia, acuerdos: acuerdos };

    showLoading(true);
    google.script.run
      .withSuccessHandler(function(resRaw) {
        showLoading(false);
        const res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
        if (res.success) {
          showToast(res.message);
          bootstrap.Modal.getInstance(document.getElementById('modalMinuta')).hide();
          refreshAppData();
        } else {
          showToast(res.message, false);
        }
      })
      .withFailureHandler(function(err) {
        showLoading(false);
        showToast(err.message, false);
      })
      .guardarMinutaCompleta(payload);
  }

  function confirmEliminarMinuta(idMinuta) {
    if (confirm('¿Desea eliminar esta minuta y todos sus registros asociados?')) {
      showLoading(true);
      google.script.run
        .withSuccessHandler(function(resRaw) {
          showLoading(false);
          const res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
          if (res.success) {
            showToast(res.message);
            refreshAppData();
          } else {
            showToast(res.message, false);
          }
        })
        .withFailureHandler(function(err) {
          showLoading(false);
          showToast(err.message, false);
        })
        .eliminarMinuta(idMinuta);
    }
  }

  function handleGenerarDocumento(idMinuta) {
    showLoading(true);
    google.script.run
      .withSuccessHandler(function(resRaw) {
        showLoading(false);
        const res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
        if (res.success) {
          showToast(res.message);
          refreshAppData();
        } else {
          showToast(res.message, false);
        }
      })
      .withFailureHandler(function(err) {
        showLoading(false);
        showToast('Error al generar el documento: ' + err.message, false);
      })
      .generarDocumentoMinuta(idMinuta);
  }

  function openModalEnviarEmailMinuta(idMinuta) {
    document.getElementById('formEnviarEmailMinuta').reset();
    document.getElementById('email_minuta_id').value = idMinuta;
    document.getElementById('email_destinatario').classList.remove('is-invalid');

    const modal = new bootstrap.Modal(document.getElementById('modalEnviarEmailMinuta'));
    modal.show();
  }

  function handleEnviarEmailMinuta(e) {
    e.preventDefault();

    const inputEmail = document.getElementById('email_destinatario');
    const emailVal = inputEmail.value.trim();
    const mensajeVal = document.getElementById('email_mensaje').value;
    const idMinuta = document.getElementById('email_minuta_id').value;

    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(emailVal)) {
      inputEmail.classList.add('is-invalid');
      return;
    }
    inputEmail.classList.remove('is-invalid');

    const payload = {
      id_minuta: idMinuta,
      email_destinatario: emailVal,
      mensaje: mensajeVal
    };

    showLoading(true);
    google.script.run
      .withSuccessHandler(function(resRaw) {
        showLoading(false);
        const res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
        if (res.success) {
          showToast(res.message);
          bootstrap.Modal.getInstance(document.getElementById('modalEnviarEmailMinuta')).hide();
        } else {
          showToast(res.message, false);
        }
      })
      .withFailureHandler(function(err) {
        showLoading(false);
        showToast(err.message, false);
      })
      .enviarMinutaPorEmail(payload);
  }

  let debounceFilterTimer = null;

  function triggerDebouncedFilter() {
    if (debounceFilterTimer) {
      clearTimeout(debounceFilterTimer);
    }
    debounceFilterTimer = setTimeout(function() {
      triggerFilterAcuerdos();
    }, 300);
  }

  function getFiltrosSeguimientoUI() {
    const elProj = document.getElementById('filterProyecto');
    const elEstado = document.getElementById('filterEstado');
    const elResp = document.getElementById('filterResponsable');
    const elFechaInicio = document.getElementById('filterFechaInicio');
    const elFechaFin = document.getElementById('filterFechaFin');
    const elTexto = document.getElementById('filterTexto');

    return {
      id_proyecto: elProj ? elProj.value : '',
      estado: elEstado ? elEstado.value : '',
      responsable: elResp ? elResp.value : '',
      fecha_inicio: elFechaInicio ? elFechaInicio.value : '',
      fecha_fin: elFechaFin ? elFechaFin.value : '',
      texto: elTexto ? elTexto.value : ''
    };
  }

  function triggerFilterAcuerdos() {
    const filtros = getFiltrosSeguimientoUI();
    const tbody = document.querySelector('#tableSeguimiento tbody');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted"><div class="spinner-border spinner-border-sm me-2" role="status"></div>Cargando acuerdos filtrados...</td></tr>';
    }

    if (dtSeguimiento && typeof dtSeguimiento.destroy === 'function') {
      dtSeguimiento.destroy();
      dtSeguimiento = null;
    }

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      renderAcuerdosFiltradosEnTabla(APP_DATA.acuerdos || []);
      return;
    }

    google.script.run
      .withSuccessHandler(function(responseRaw) {
        const response = typeof responseRaw === 'string' ? JSON.parse(responseRaw) : responseRaw;
        if (response && response.success) {
          renderAcuerdosFiltradosEnTabla(response.data || []);
        } else {
          showToast((response && response.message) || 'Error al filtrar acuerdos.', false);
          renderAcuerdosFiltradosEnTabla([]);
        }
      })
      .withFailureHandler(function(err) {
        showToast('Error de conexión al filtrar: ' + (err ? err.message : 'Desconocido'), false);
        renderAcuerdosFiltradosEnTabla([]);
      })
      .obtenerAcuerdosFiltrados(filtros);
  }

  function renderSeguimientoTable() {
    triggerFilterAcuerdos();
  }

  function renderAcuerdosFiltradosEnTabla(acuerdosList) {
    if (dtSeguimiento && typeof dtSeguimiento.destroy === 'function') {
      dtSeguimiento.destroy();
      dtSeguimiento = null;
    }

    const tbody = document.querySelector('#tableSeguimiento tbody');
    if (!tbody) return;
    tbody.innerHTML = '';

    if (!acuerdosList || acuerdosList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No se encontraron acuerdos con los criterios seleccionados.</td></tr>';
      return;
    }

    acuerdosList.forEach(function(ac, index) {
      const badgeClass = getBadgeClass(ac.estado_calculado);
      const motivo = ac.motivo_cancelacion ? '<br><small class="text-muted"><em>Motivo: ' + escapeHtml(ac.motivo_cancelacion) + '</em></small>' : '';
      const prioBadge = ac.prioridad === 'Alta' ? 'bg-danger' : (ac.prioridad === 'Baja' ? 'bg-info' : 'bg-warning text-dark');
      const tipoBadge = ac.tipo === 'Informativo' ? 'bg-info' : (ac.tipo === 'Ajuste Técnico' ? 'bg-purple text-white' : 'bg-primary');
      const trackingText = (ac.tracking ? ac.tracking : '-') + (ac.num_acuerdo_anterior ? (' (Ac: ' + ac.num_acuerdo_anterior + ')') : '');

      tbody.innerHTML += '<tr>' +
        '<td class="text-center fw-bold">' + (index + 1) + '</td>' +
        '<td>' + escapeHtml(ac.descripcion) + motivo + '</td>' +
        '<td><span class="badge ' + tipoBadge + '">' + escapeHtml(ac.tipo || 'Acuerdo') + '</span></td>' +
        '<td><span class="badge ' + prioBadge + '">' + escapeHtml(ac.prioridad || 'Media') + '</span></td>' +
        '<td><span class="badge bg-light text-dark border"><i class="bi bi-person me-1"></i>' + escapeHtml(ac.responsable || '-') + '</span></td>' +
        '<td>' + escapeHtml(trackingText) + '</td>' +
        '<td>' + formatDateDisplayJS(ac.fecha_cumplimiento) + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + escapeHtml(ac.estado_calculado) + '</span></td>' +
        '<td><div class="fw-bold">' + escapeHtml(ac.nombre_proyecto) + '</div><small class="text-muted">' + escapeHtml(ac.titulo_minuta) + ' (' + escapeHtml(ac.folio_minuta || 'N/A') + ')</small></td>' +
        '<td class="text-end">' +
          '<button class="btn btn-sm btn-outline-primary" onclick="openModalEstadoAcuerdo(\'' + escapeJs(ac.id_acuerdo) + '\', \'' + escapeJs(ac.estado_calculado) + '\', \'' + escapeJs(ac.motivo_cancelacion || '') + '\', \'' + escapeJs(ac.tracking || '') + '\', \'' + escapeJs(ac.num_acuerdo_anterior || '') + '\')">' +
            '<i class="bi bi-arrow-repeat"></i> Cambiar' +
          '</button>' +
        '</td>' +
      '</tr>';
    });

    if (typeof $ !== 'undefined' && $.fn && $.fn.dataTable) {
      dtSeguimiento = $('#tableSeguimiento').DataTable({
        language: { url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' },
        pageLength: 15,
        retrieve: true,
        searching: false
      });
    }
  }

  function openModalEstadoAcuerdo(idAcuerdo, estadoActual, motivo, trackingVal, numAntVal) {
    if (motivo === undefined) motivo = '';
    if (trackingVal === undefined) trackingVal = '';
    if (numAntVal === undefined) numAntVal = '';

    document.getElementById('acuerdo_id_cambio').value = idAcuerdo;
    document.getElementById('acuerdo_nuevo_estado').value = (estadoActual === 'Por vencer' || estadoActual === 'Vencido') ? 'Pendiente' : estadoActual;
    document.getElementById('acuerdo_motivo_cancelacion').value = motivo;
    document.getElementById('acuerdo_num_ant_cambio').value = numAntVal;

    const selTracking = document.getElementById('acuerdo_tracking_cambio');
    if (selTracking) {
      selTracking.setAttribute('data-selected', trackingVal);
      const minutas = APP_DATA.minutas || [];
      selTracking.innerHTML = '<option value="">-- Sin Minuta Anterior --</option>';

      let isSelected = false;
      const rawVal = trackingVal ? trackingVal.trim() : '';

      minutas.forEach(function(m) {
        const folioVal = (m.folio && m.folio !== 'N/A') ? m.folio : (m.titulo || m.id_minuta);
        const labelText = (m.folio && m.folio !== 'N/A') ? (m.folio + ' - ' + m.titulo) : m.titulo;
        const opt = document.createElement('option');
        opt.value = folioVal;
        opt.textContent = labelText;

        if (rawVal && (rawVal === folioVal || rawVal.split(',').map(function(s){return s.trim();}).includes(folioVal))) {
          opt.selected = true;
          isSelected = true;
        }
        selTracking.appendChild(opt);
      });

      if (rawVal && !isSelected) {
        const opt = document.createElement('option');
        opt.value = rawVal;
        opt.textContent = rawVal;
        opt.selected = true;
        selTracking.appendChild(opt);
      }
    }

    toggleMotivoCancelacion(document.getElementById('acuerdo_nuevo_estado').value);

    const modal = new bootstrap.Modal(document.getElementById('modalEstadoAcuerdo'));
    modal.show();
  }

  function toggleMotivoCancelacion(estado) {
    const group = document.getElementById('groupMotivoCancelacion');
    if (group && group.classList) {
      if (estado === 'Cancelado') {
        group.classList.remove('d-none');
      } else {
        group.classList.remove('d-none');
      }
    }
  }

  function handleGuardarEstadoAcuerdo(e) {
    e.preventDefault();
    const idAcuerdo = document.getElementById('acuerdo_id_cambio').value;
    const nuevoEstado = document.getElementById('acuerdo_nuevo_estado').value;
    const motivo = document.getElementById('acuerdo_motivo_cancelacion').value;
    const numAntVal = document.getElementById('acuerdo_num_ant_cambio').value;

    const selTracking = document.getElementById('acuerdo_tracking_cambio');
    const trackingStr = selTracking ? selTracking.value : '';

    showLoading(true);
    google.script.run
      .withSuccessHandler(function(resRaw) {
        showLoading(false);
        const res = typeof resRaw === 'string' ? JSON.parse(resRaw) : resRaw;
        if (res.success) {
          showToast(res.message);
          bootstrap.Modal.getInstance(document.getElementById('modalEstadoAcuerdo')).hide();
          refreshAppData();
        } else {
          showToast(res.message, false);
        }
      })
      .withFailureHandler(function(err) {
        showLoading(false);
        showToast(err.message, false);
      })
      .actualizarEstadoAcuerdo(idAcuerdo, nuevoEstado, motivo, trackingStr, numAntVal);
  }

  function populateSelects() {
    populateSelectProyectos();

    const filterResp = document.getElementById('filterResponsable');
    if (filterResp) {
      const currentResp = filterResp.value;
      filterResp.innerHTML = '<option value="">Todos los responsables</option>';

      const respSet = new Set();
      APP_DATA.acuerdos.forEach(function(a) {
        if (a.responsable) {
          const list = a.responsable.split(',').map(function(s) { return s.trim(); });
          list.forEach(function(item) {
            if (item) respSet.add(item);
          });
        }
      });

      const responsables = Array.from(respSet).sort();
      responsables.forEach(function(r) {
        const selected = (r === currentResp) ? 'selected' : '';
        filterResp.innerHTML += '<option value="' + escapeHtml(r) + '" ' + selected + '>' + escapeHtml(r) + '</option>';
      });
    }

    const filterProj = document.getElementById('filterProyecto');
    if (filterProj) {
      const currentProj = filterProj.value;
      filterProj.innerHTML = '<option value="">Todos los proyectos</option>';
      APP_DATA.proyectos.forEach(function(p) {
        const selected = (p.id_proyecto === currentProj) ? 'selected' : '';
        filterProj.innerHTML += '<option value="' + escapeHtml(p.id_proyecto) + '" ' + selected + '>' + escapeHtml(p.nombre) + '</option>';
      });
    }
  }

  function populateSelectProyectos() {
    const sel = document.getElementById('minuta_proyecto');
    if (!sel) return;
    sel.innerHTML = '<option value="">-- Seleccione un Proyecto --</option>';
    APP_DATA.proyectos.forEach(function(p) {
      sel.innerHTML += '<option value="' + escapeHtml(p.id_proyecto) + '">' + escapeHtml(p.nombre) + '</option>';
    });
  }

  function getBadgeClass(estado) {
    switch (estado) {
      case 'Pendiente': return 'badge-pendiente';
      case 'Por vencer': return 'badge-por-vencer';
      case 'Vencido': return 'badge-vencido';
      case 'Atendido': return 'badge-atendido';
      case 'Cancelado': return 'badge-cancelado';
      default: return 'bg-secondary';
    }
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function escapeJs(str) {
    if (!str) return '';
    return String(str)
      .replace(/\\/g, '\\\\')
      .replace(/'/g, "\\'")
      .replace(/"/g, '\\"')
      .replace(/\n/g, '\\n')
      .replace(/\r/g, '\\r');
  }

  function formatDateDisplayJS(dateStr) {
    if (!dateStr) return '-';
    const date = new Date(dateStr);
    if (isNaN(date.getTime())) return String(dateStr);
    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();
    return day + '/' + month + '/' + year;
  }

  function formatDateISOJS(dateStr) {
    if (!dateStr) return '';
    const date = new Date(dateStr);
    if (isNaN(date.getTime())) return String(dateStr).split('T')[0];
    return date.toISOString().split('T')[0];
  }
</script>
