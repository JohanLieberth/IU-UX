<!-- Dashboard Component -->
<div class="row g-3 mb-4">
  <div class="col-12 col-sm-6 col-md-4 col-xl-2">
    <div class="card card-dashboard border-0 shadow-sm bg-primary text-white h-100">
      <div class="card-body p-3 text-center">
        <div class="text-white-50 small text-uppercase fw-bold">Total Acuerdos</div>
        <div class="display-6 fw-bold my-1" id="kpi-total">0</div>
        <div class="small text-white-50"><i class="bi bi-folder-check"></i> En sistema</div>
      </div>
    </div>
  </div>

  <div class="col-12 col-sm-6 col-md-4 col-xl-2">
    <div class="card card-dashboard border-0 shadow-sm bg-warning text-dark h-100">
      <div class="card-body p-3 text-center">
        <div class="text-dark-50 small text-uppercase fw-bold">Pendientes</div>
        <div class="display-6 fw-bold my-1" id="kpi-pendientes">0</div>
        <div class="small text-dark-50"><i class="bi bi-clock-history"></i> Por resolver</div>
      </div>
    </div>
  </div>

  <div class="col-12 col-sm-6 col-md-4 col-xl-2">
    <div class="card card-dashboard border-0 shadow-sm bg-danger text-white h-100">
      <div class="card-body p-3 text-center">
        <div class="text-white-50 small text-uppercase fw-bold">Vencidos</div>
        <div class="display-6 fw-bold my-1" id="kpi-vencidos">0</div>
        <div class="small text-white-50"><i class="bi bi-exclamation-triangle-fill"></i> Vencido & Pendiente</div>
      </div>
    </div>
  </div>

  <div class="col-12 col-sm-6 col-md-4 col-xl-2">
    <div class="card card-dashboard border-0 shadow-sm bg-success text-white h-100">
      <div class="card-body p-3 text-center">
        <div class="text-white-50 small text-uppercase fw-bold">Resueltos</div>
        <div class="display-6 fw-bold my-1" id="kpi-resueltos">0</div>
        <div class="small text-white-50"><i class="bi bi-check-circle-fill"></i> Cumplidos</div>
      </div>
    </div>
  </div>

  <div class="col-12 col-sm-6 col-md-4 col-xl-2">
    <div class="card card-dashboard border-0 shadow-sm text-white h-100" style="background-color: #6f42c1;">
      <div class="card-body p-3 text-center">
        <div class="text-white-50 small text-uppercase fw-bold">Por Firmar</div>
        <div class="display-6 fw-bold my-1" id="kpi-firmar">0</div>
        <div class="small text-white-50"><i class="bi bi-pen"></i> Pendiente firma</div>
      </div>
    </div>
  </div>

  <div class="col-12 col-sm-6 col-md-4 col-xl-2">
    <div class="card card-dashboard border-0 shadow-sm bg-secondary text-white h-100">
      <div class="card-body p-3 text-center">
        <div class="text-white-50 small text-uppercase fw-bold">Informativos</div>
        <div class="display-6 fw-bold my-1" id="kpi-informativos">0</div>
        <div class="small text-white-50"><i class="bi bi-info-circle-fill"></i> Solo lectura</div>
      </div>
    </div>
  </div>
</div>
