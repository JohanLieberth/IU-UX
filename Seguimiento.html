<div class="container-fluid fade-in">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-1 text-slate-800">Seguimiento de Acuerdos</h2>
      <p class="text-muted mb-0">Control y monitoreo de compromisos, fechas límite y estados.</p>
    </div>
  </div>

  <!-- Panel de Filtros -->
  <div class="card card-custom p-3 mb-4">
    <div class="row g-3">
      <div class="col-md-3">
        <label for="filterProyecto" class="form-label small fw-bold">Proyecto</label>
        <select class="form-select form-select-sm" id="filterProyecto" onchange="applyAcuerdosFilters()">
          <option value="">Todos los proyectos</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="filterEstado" class="form-label small fw-bold">Estado</label>
        <select class="form-select form-select-sm" id="filterEstado" onchange="applyAcuerdosFilters()">
          <option value="">Todos los estados</option>
          <option value="Pendiente">Pendiente</option>
          <option value="Por vencer">Por vencer</option>
          <option value="Vencido">Vencido</option>
          <option value="Atendido">Atendido</option>
          <option value="Cancelado">Cancelado</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="filterResponsable" class="form-label small fw-bold">Responsable</label>
        <select class="form-select form-select-sm" id="filterResponsable" onchange="applyAcuerdosFilters()">
          <option value="">Todos los responsables</option>
        </select>
      </div>
      <div class="col-md-3">
        <label for="filterFechaFin" class="form-label small fw-bold">Hasta Fecha</label>
        <input type="date" class="form-control form-control-sm" id="filterFechaFin" onchange="applyAcuerdosFilters()">
      </div>
    </div>
  </div>

  <!-- Tabla de Acuerdos -->
  <div class="card card-custom p-3">
    <div class="table-responsive">
      <table class="table table-hover align-middle w-100" id="tableSeguimiento">
        <thead class="table-light">
          <tr>
            <th>Proyecto / Minuta</th>
            <th>Descripción del Acuerdo</th>
            <th>Responsable</th>
            <th>Fecha Cumplimiento</th>
            <th>Estado</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <!-- Se llena dinámicamente -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal Cambiar Estado / Cancelar -->
<div class="modal fade" id="modalEstadoAcuerdo" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="formEstadoAcuerdo" onsubmit="handleGuardarEstadoAcuerdo(event)">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Cambiar Estado de Acuerdo</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="acuerdo_id_cambio">
          <div class="mb-3">
            <label class="form-label fw-semibold">Estado</label>
            <select class="form-select" id="acuerdo_nuevo_estado" onchange="toggleMotivoCancelacion(this.value)">
              <option value="Pendiente">Pendiente</option>
              <option value="Atendido">Atendido</option>
              <option value="Cancelado">Cancelado</option>
            </select>
          </div>
          <div class="mb-3 d-none" id="groupMotivoCancelacion">
            <label for="acuerdo_motivo_cancelacion" class="form-label fw-semibold">Motivo de Cancelación</label>
            <textarea class="form-control" id="acuerdo_motivo_cancelacion" rows="3" placeholder="Escriba la razón de la cancelación..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary px-4">Guardar Cambio</button>
        </div>
      </form>
    </div>
  </div>
</div>
