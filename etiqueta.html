<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Etiqueta Equipo - BitFix</title>
  <style>
    @page {
      size: 50mm 30mm;
      margin: 1mm;
    }
    body {
      font-family: Arial, sans-serif;
      font-size: 8px;
      line-height: 1.1;
      width: 48mm;
      height: 28mm;
      margin: 0 auto;
      padding: 0;
      color: #000;
      overflow: hidden;
    }
    .label-box {
      border: 1px solid #000;
      padding: 2px;
      height: 26mm;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
    }
    .label-info {
      width: 32mm;
    }
    .label-qr {
      width: 13mm;
      text-align: right;
    }
    .bold { font-weight: bold; }
    .title { font-size: 9px; }
    .truncate {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body onload="window.print()">

  <? if (data && data.Items && data.Items.length > 0) { ?>
    <? var item = data.Items[0]; ?>
    <div class="label-box">
      <div class="label-info">
        <div class="bold title">BitFix - <?= item.ServicioID ?></div>
        <div class="truncate"><strong>Ord:</strong> <?= data.OrdenID ?></div>
        <div class="truncate"><strong>Cliente:</strong> <?= data.ClienteNombre ?></div>
        <div class="truncate"><strong>Equipo:</strong> <?= item.Equipo ?></div>
        <div class="truncate"><strong>Serie:</strong> <?= item.NoSerie ?></div>
        <div class="truncate"><strong>Falla:</strong> <?= item.FallaReportada ?></div>
        <div class="truncate"><strong>Fecha:</strong> <?= data.FechaHora ?></div>
      </div>
      <div class="label-qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=<?= item.ServicioID ?>" style="width: 13mm; height: 13mm;" alt="QR">
      </div>
    </div>
  <? } ?>

</body>
</html>
